<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AgriCréditPlus — Entretiens terrain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7F5;
    --surface:#FFFFFF;
    --surface-2:#FBFBFA;
    --border:#DEE1DA;
    --text:#22262A;
    --text-soft:#6B716A;
    --text-faint:#9A9F97;
    --accent:#3B6E63;
    --accent-soft:#E6EEEB;
    --accent-text:#2A5049;
    --danger:#B5482D;
    --danger-soft:#F7EAE5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Space Mono',monospace;}
  h1,h2,h3{margin:0; font-weight:500;}
  a:focus-visible,button:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  .landing{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .landing-inner{max-width:640px; width:100%;}
  .landing-inner h1{font-size:1.5rem;}
  .landing-inner .sub{color:var(--text-soft); margin:6px 0 28px; font-size:.95rem;}
  .conn-status{font-size:.78rem; color:var(--text-faint); margin-bottom:18px;}
  .conn-status.ok{color:var(--accent-text);}
  .conn-status.err{color:var(--danger);}
  .guide-cards{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .guide-card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:20px 16px; text-align:left; cursor:pointer; font-family:inherit;
  }
  .guide-card:hover{border-color:var(--accent);}
  .guide-card .name{font-size:1rem; font-weight:500;}
  .guide-card .count{display:block; margin-top:6px; font-size:.8rem; color:var(--text-soft);}
  @media (max-width:480px){ .guide-cards{grid-template-columns:1fr;} }

  #app{display:none;}
  header.top{
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:14px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  header.top h1{font-size:1.05rem;}
  header.top .sub{font-size:.78rem; color:var(--text-soft); margin-top:2px;}
  .tabs{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:3px;}
  .tab-btn{
    border:none; background:none; padding:7px 12px; font-size:.85rem; color:var(--text-soft);
    border-radius:6px; cursor:pointer; font-family:inherit;
  }
  .tab-btn.active{background:var(--surface); color:var(--accent-text); border:1px solid var(--border);}
  .btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    padding:8px 13px; border-radius:8px; font-size:.85rem; cursor:pointer; font-family:inherit;
  }
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.danger{color:var(--danger); border-color:var(--danger-soft);}
  .btn.small{padding:5px 9px; font-size:.78rem;}

  main{max-width:960px; margin:0 auto; padding:20px 16px 80px;}

  .section{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 16px 18px; margin-bottom:14px;}
  .section h2{font-size:.98rem; margin-bottom:14px; color:var(--accent-text);}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:.78rem; color:var(--text-soft); margin-bottom:6px;}
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%; font-family:inherit; font-size:.92rem; padding:9px 11px;
    border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--text);
  }
  textarea{min-height:60px; resize:vertical;}
  .chip-group{display:flex; flex-wrap:wrap; gap:7px;}
  .chip{
    border:1px solid var(--border); background:#fff; color:var(--text);
    padding:8px 12px; border-radius:8px; font-size:.88rem; cursor:pointer; user-select:none;
  }
  .chip.selected{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-text); font-weight:500;}
  .other-input{margin-top:8px; display:none;}
  .other-input.show{display:block;}

  .action-bar{
    position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--border);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; z-index:30;
  }
  .action-bar .btn{flex:1;}
  .action-bar .btn.primary{flex:1.4;}

  #toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-140%);
    background:var(--text); color:#fff; padding:9px 16px; border-radius:999px; font-size:.85rem; z-index:60;
    transition:transform .2s ease;
  }
  #toast.show{transform:translateX(-50%) translateY(0);}

  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:10px; background:var(--surface);}
  table{border-collapse:collapse; width:100%; font-size:.82rem;}
  th,td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; max-width:220px; overflow:hidden; text-overflow:ellipsis;}
  th{background:var(--surface-2); color:var(--text-soft); font-weight:500; position:sticky; top:0;}
  td:first-child, th:first-child{position:sticky; left:0; background:var(--surface); z-index:1;}
  th:first-child{background:var(--surface-2); z-index:2;}
  tr:hover td{background:var(--accent-soft);}
  tr:hover td:first-child{background:var(--accent-soft);}
  .empty-note{color:var(--text-soft); font-size:.88rem; text-align:center; padding:40px 10px;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px; flex-wrap:wrap;}

  .editor-section{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 14px 16px; margin-bottom:14px;}
  .editor-section .sec-head{display:flex; gap:8px; align-items:center; margin-bottom:12px;}
  .editor-section .sec-head input{font-size:.95rem; font-weight:500;}
  .editor-question{border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px; background:var(--surface-2);}
  .editor-question .row{display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
  .editor-question .row input[type=text]{flex:1; min-width:180px;}
  .editor-question select{width:auto; min-width:140px;}
  .editor-question textarea.opts{display:none;}
  .editor-question textarea.opts.show{display:block; margin-bottom:8px;}
  .editor-question label.other-toggle{display:none; align-items:center; gap:6px; font-size:.8rem; color:var(--text-soft); margin-bottom:8px;}
  .editor-question label.other-toggle.show{display:flex;}
  .q-actions{display:flex; gap:6px; justify-content:flex-end;}
  .editor-footer{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}

  .metric-block{margin-bottom:16px;}
  .metric-block:last-child{margin-bottom:0;}
  .metric-q{font-size:.88rem; margin-bottom:8px; color:var(--text);}
  .metric-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .metric-label{width:170px; flex-shrink:0; font-size:.8rem; color:var(--text-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .metric-bar{flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:4px; height:9px; overflow:hidden;}
  .metric-fill{background:var(--accent); height:100%;}
  .metric-val{width:78px; text-align:right; font-size:.78rem; color:var(--text-soft); flex-shrink:0;}
  .metric-note{font-size:.78rem; color:var(--text-faint); margin-top:2px;}

  .proof-preview{display:flex; align-items:center; gap:10px; margin-top:8px;}
  .proof-preview img{max-width:90px; max-height:90px; border-radius:6px; border:1px solid var(--border); display:none;}
  .proof-filename{font-size:.8rem; color:var(--text-soft);}

  .admin-shell{display:flex; gap:20px; align-items:flex-start;}
  .admin-sidebar{display:flex; flex-direction:column; gap:3px; width:180px; flex-shrink:0; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px;}
  .admin-nav-btn{border:none; background:none; text-align:left; padding:9px 10px; border-radius:8px; font-size:.86rem; color:var(--text-soft); cursor:pointer; font-family:inherit;}
  .admin-nav-btn:hover{background:var(--surface-2);}
  .admin-nav-btn.active{background:var(--accent-soft); color:var(--accent-text); font-weight:500;}
  .admin-content{flex:1; min-width:0;}
  .admin-metrics-filter{margin-bottom:14px;}
  @media (max-width:680px){
    .admin-shell{flex-direction:column;}
    .admin-sidebar{width:100%; flex-direction:row; overflow-x:auto;}
  }
  .stat-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px;}
  .stat-card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; text-align:center;}
  .stat-card .num{font-size:1.4rem; font-family:'Space Mono',monospace; color:var(--accent-text);}
  .stat-card .label{font-size:.78rem; color:var(--text-soft); margin-top:4px;}
  @media (max-width:480px){ .stat-cards{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div id="toast"></div>

<div class="landing" id="landing">
  <div class="landing-inner">
    <h1>AgriCréditPlus</h1>
    <p class="sub">Choisissez le guide d'entretien à utiliser.</p>
    <div class="conn-status" id="connStatus">Connexion à la base…</div>
    <div class="guide-cards">
      <button class="guide-card" data-guide="agriculteurs" type="button">
        <span class="name">Agriculteurs</span>
        <span class="count" id="countAgri">—</span>
      </button>
      <button class="guide-card" data-guide="institutions" type="button">
        <span class="name">Institutions financières</span>
        <span class="count" id="countInst">—</span>
      </button>
    </div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div>
      <h1 id="guideTitle">—</h1>
      <div class="sub" id="guideSub"></div>
    </div>
    <div class="tabs">
      <button class="tab-btn" data-tab="form" type="button">Nouvelle fiche</button>
      <button class="tab-btn" data-tab="table" type="button">Toutes les fiches</button>
      <button class="tab-btn" data-tab="metrics" type="button">Métriques</button>
      <button class="tab-btn" data-tab="admin" type="button">Admin</button>
    </div>
    <button class="btn small" id="backToLanding" type="button">Changer de guide</button>
  </header>

  <main>
    <div id="tab-form"></div>
    <div id="tab-table" style="display:none;"></div>
    <div id="tab-metrics" style="display:none;"></div>
    <div id="tab-admin" style="display:none;"></div>
  </main>

  <div class="action-bar" id="formActionBar">
    <button class="btn" id="resetBtn" type="button">Nouvelle fiche vierge</button>
    <button class="btn primary" id="saveBtn" type="button">Enregistrer la fiche</button>
  </div>
</div>

function fieldHTML(question){
  const qid = question.id;
  if(question.type==='text') return `<div class="field"><label>${esc(question.label)}</label><input type="text" id="f_${qid}"></div>`;
  if(question.type==='number') return `<div class="field"><label>${esc(question.label)}</label><input type="number" id="f_${qid}"></div>`;
  if(question.type==='date') return `<div class="field"><label>${esc(question.label)}</label><input type="date" id="f_${qid}"></div>`;
  if(question.type==='textarea') return `<div class="field"><label>${esc(question.label)}</label><textarea id="f_${qid}"></textarea></div>`;
  if(question.type==='single' || question.type==='multi'){
    let chips = question.options.map(o=>`<div class="chip" tabindex="0" data-value="${esc(o)}">${esc(o)}</div>`).join('');
    if(question.hasOther) chips += `<div class="chip" tabindex="0" data-value="Autre" data-other="true">Autre</div>`;
    let otherBox = question.hasOther ? `<input type="text" id="f_${qid}__other" class="other-input" placeholder="Précisez...">` : '';
    return `<div class="field"><label>${esc(question.label)}</label>
      <div class="chip-group" id="f_${qid}" data-mode="${question.type}">${chips}</div>${otherBox}</div>`;
  }
  if(question.type==='proof'){
    return `<div class="field"><label>${esc(question.label)} (optionnel)</label>
      <input type="text" id="f_${qid}__link" placeholder="Lien (photo, vidéo, document...)">
      <input type="file" id="f_${qid}__file" accept="image/*,application/pdf" style="margin-top:8px;">
      <input type="hidden" id="f_${qid}__data">
      <input type="hidden" id="f_${qid}__filename">
      <div id="f_${qid}__preview" class="proof-preview" style="display:none;">
        <img alt="Aperçu">
        <span class="proof-filename"></span>
        <button type="button" id="f_${qid}__remove" class="btn small">Retirer</button>
      </div>
    </div>`;
  }
  return '';
}

function setupProofField(qid){
  const fileInput = document.getElementById('f_'+qid+'__file');
  if(!fileInput) return;
  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.type.startsWith('image/')){
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const img = new Image();
        img.onload = ()=>{
          const maxDim=800; let w=img.width,h=img.height;
          if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
          else if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
          const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          document.getElementById('f_'+qid+'__data').value = canvas.toDataURL('image/jpeg',0.7);
          document.getElementById('f_'+qid+'__filename').value = file.name;
          updateProofPreview(qid);
          showToast('Fichier ajouté');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    } else {
      const reader = new FileReader();
      reader.onload = (ev)=>{
        document.getElementById('f_'+qid+'__data').value = ev.target.result;
        document.getElementById('f_'+qid+'__filename').value = file.name;
        updateProofPreview(qid);
        showToast('Fichier ajouté');
      };
      reader.readAsDataURL(file);
    }
  });
  const removeBtn = document.getElementById('f_'+qid+'__remove');
  if(removeBtn) removeBtn.addEventListener('click', ()=>{
    document.getElementById('f_'+qid+'__data').value='';
    document.getElementById('f_'+qid+'__filename').value='';
    fileInput.value='';
    updateProofPreview(qid);
  });
}
function updateProofPreview(qid){
  const dataEl = document.getElementById('f_'+qid+'__data');
  const nameEl = document.getElementById('f_'+qid+'__filename');
  const wrap = document.getElementById('f_'+qid+'__preview');
  if(!dataEl || !wrap) return;
  if(dataEl.value){
    wrap.style.display='flex';
    wrap.querySelector('.proof-filename').textContent = nameEl.value || 'Fichier joint';
    const img = wrap.querySelector('img');
    if(dataEl.value.indexOf('data:image')===0){ img.src=dataEl.value; img.style.display='block'; }
    else { img.style.display='none'; }
  } else {
    wrap.style.display='none';
  }
}
function formatProofVal(v){
  if(!v || (!v.link && !v.fileData)) return '—';
  const parts=[];
  if(v.link) parts.push('Lien: '+v.link);
  if(v.fileData) parts.push('Fichier: '+(v.fileName||'joint'));
  return parts.join(' | ');
}
function setupChipGroups(container){
  container.querySelectorAll('.chip-group').forEach(group=>{
    const mode = group.dataset.mode;
    const qid = group.id.replace('f_','');
    const otherInput = document.getElementById('f_'+qid+'__other');
    function updateOther(){
      if(!otherInput) return;
      const otherChip = group.querySelector('[data-other="true"]');
      const on = otherChip && otherChip.classList.contains('selected');
      otherInput.classList.toggle('show', !!on);
      if(!on) otherInput.value='';
    }
    group.querySelectorAll('.chip').forEach(chip=>{
      function toggle(){
        if(mode==='single'){
          group.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
          chip.classList.add('selected');
        } else {
          chip.classList.toggle('selected');
        }
        updateOther();
      }
      chip.addEventListener('click', toggle);
      chip.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
    });
  });
}
function collectAnswers(){
  const schema = schemas[currentGuide];
  const answers = {};
  flatQuestions(schema).forEach(qn=>{
    const qid=qn.id;
    if(qn.type==='single'||qn.type==='multi'){
      const group = document.getElementById('f_'+qid);
      if(!group){ answers[qid]= qn.type==='single' ? '' : []; return; }
      let vals = Array.from(group.querySelectorAll('.chip.selected')).map(c=>c.dataset.value);
      const otherInput = document.getElementById('f_'+qid+'__other');
      if(otherInput && vals.includes('Autre')){
        const txt = otherInput.value.trim();
        vals = vals.map(v=> v==='Autre' ? ('Autre'+(txt?': '+txt:'')) : v);
      }
      answers[qid] = qn.type==='single' ? (vals[0]||'') : vals;
    } else if(qn.type==='proof'){
      const linkEl = document.getElementById('f_'+qid+'__link');
      const dataEl = document.getElementById('f_'+qid+'__data');
      const nameEl = document.getElementById('f_'+qid+'__filename');
      answers[qid] = {
        link: linkEl ? linkEl.value.trim() : '',
        fileData: dataEl ? dataEl.value : '',
        fileName: nameEl ? nameEl.value : ''
      };
    } else {
      const el = document.getElementById('f_'+qid);
      answers[qid] = el ? el.value.trim() : '';
    }
  });
  return answers;
}

function fillForm(answers){
  const schema = schemas[currentGuide];
  flatQuestions(schema).forEach(qn=>{
    const val = answers ? answers[qn.id] : undefined;
    if(qn.type==='single'||qn.type==='multi'){
      const group = document.getElementById('f_'+qn.id);
      if(!group) return;
      group.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
      const otherInput = document.getElementById('f_'+qn.id+'__other');
      if(otherInput){ otherInput.classList.remove('show'); otherInput.value=''; }
      const vals = qn.type==='single' ? (val?[val]:[]) : (Array.isArray(val)?val:[]);
      vals.forEach(v=>{
        let matchVal = v, otherText = '';
        if(typeof v==='string' && v.indexOf('Autre')===0){
          matchVal='Autre';
          const idx=v.indexOf(':');
          if(idx>-1) otherText=v.slice(idx+1).trim();
        }
        const chip = Array.from(group.querySelectorAll('.chip')).find(c=>c.dataset.value===matchVal);
        if(chip){
          chip.classList.add('selected');
          if(matchVal==='Autre' && otherInput){ otherInput.classList.add('show'); otherInput.value=otherText; }
        }
      });
    } else if(qn.type==='proof'){
      const linkEl = document.getElementById('f_'+qn.id+'__link');
      const dataEl = document.getElementById('f_'+qn.id+'__data');
      const nameEl = document.getElementById('f_'+qn.id+'__filename');
      if(linkEl) linkEl.value = (val && val.link) || '';
      if(dataEl) dataEl.value = (val && val.fileData) || '';
      if(nameEl) nameEl.value = (val && val.fileName) || '';
      updateProofPreview(qn.id);
    } else {
      const el = document.getElementById('f_'+qn.id);
      if(el) el.value = val || '';
    }
  });
}

function csvEscape(v){
  v = (v===undefined||v===null) ? '' : String(v);
  if(/[",\n;]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function exportCSV(){
  const schema = schemas[currentGuide];
  const qs = flatQuestions(schema);
  const entries = entriesByGuide[currentGuide];
  if(entries.length===0){ showToast('Aucune fiche à exporter'); return; }
  const header = ['Horodatage'].concat(qs.map(q=>q.label)).map(csvEscape).join(',');
  const rows = entries.map(f=>{
    const cells = [f.createdAt || ''];
    qs.forEach(qn=>{
      const v = f.answers ? f.answers[qn.id] : '';
      if(qn.type==='proof') cells.push(formatProofVal(v)==='—' ? '' : formatProofVal(v));
      else cells.push(Array.isArray(v)? v.join(' | ') : (v||''));
    });
    return cells.map(csvEscape).join(',');
  });
  const csv = '\uFEFF'+[header,...rows].join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = 'agricredit-'+currentGuide+'-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);

/* ---------------- METRICS ---------------- */
function computeMetrics(schema, entries){
  const total = entries.length;
  return flatQuestions(schema).map(qn=>{
    if(qn.type==='single' || qn.type==='multi'){
      const counts = {};
      let answered = 0;
      entries.forEach(f=>{
        const v = f.answers ? f.answers[qn.id] : undefined;
        const vals = qn.type==='single' ? (v?[v]:[]) : (Array.isArray(v)?v:[]);
        if(vals.length) answered++;
        vals.forEach(val=>{ counts[val] = (counts[val]||0)+1; });
      });
      return {question:qn, type:'choice', answered, counts};
    }
    if(qn.type==='number'){
      const nums = entries.map(f=> f.answers ? parseFloat(f.answers[qn.id]) : NaN).filter(n=>!isNaN(n));
      return {
        question:qn, type:'number', answered:nums.length,
        avg: nums.length ? nums.reduce((a,b)=>a+b,0)/nums.length : null,
        min: nums.length ? Math.min(...nums) : null,
        max: nums.length ? Math.max(...nums) : null
      };
    }
    if(qn.type==='proof'){
      const answered = entries.filter(f=>{
        const v = f.answers && f.answers[qn.id];
        return v && (v.link || v.fileData);
      }).length;
      return {question:qn, type:'proof', answered};
    }
    const answered = entries.filter(f=> f.answers && f.answers[qn.id] && String(f.answers[qn.id]).trim()!=='').length;
    return {question:qn, type:'text', answered};
  });
}
function groupChoiceCounts(qn, counts){
  const optsOrder = qn.options.concat(qn.hasOther?['Autre']:[]);
  const grouped = {};
  Object.keys(counts).forEach(k=>{
    const key = k.indexOf('Autre')===0 ? 'Autre' : k;
    grouped[key] = (grouped[key]||0) + counts[k];
  });
  const allKeys = Array.from(new Set([...optsOrder, ...Object.keys(grouped)]));
  return allKeys.map(k=>({label:k, count:grouped[k]||0}));
}
function metricBlockHTML(r, total){
  const qn = r.question;
  let inner = `<div class="metric-block"><div class="metric-q">${esc(qn.label)}</div>`;
  if(r.type==='choice'){
    groupChoiceCounts(qn, r.counts).forEach(o=>{
      const pct = total ? Math.round(o.count/total*100) : 0;
      inner += `<div class="metric-row"><span class="metric-label" title="${esc(o.label)}">${esc(o.label)}</span><div class="metric-bar"><div class="metric-fill" style="width:${pct}%"></div></div><span class="metric-val">${o.count} (${pct}%)</span></div>`;
    });
    inner += `<div class="metric-note">${r.answered}/${total} ont répondu</div>`;
  } else if(r.type==='number'){
    inner += `<div class="metric-note">${r.answered}/${total} réponses — moyenne ${r.avg!==null?r.avg.toFixed(1):'—'}, min ${r.min!==null?r.min:'—'}, max ${r.max!==null?r.max:'—'}</div>`;
  } else if(r.type==='proof'){
    inner += `<div class="metric-note">${r.answered}/${total} fiches ont une preuve jointe (lien ou fichier)</div>`;
  } else {
    inner += `<div class="metric-note">${r.answered}/${total} réponses renseignées</div>`;
  }
  inner += `</div>`;
  return inner;
}
function metricsSectionsHTML(schema, entries){
  if(entries.length===0) return `<p class="empty-note">Aucune donnée à analyser pour le moment.</p>`;
  const results = computeMetrics(schema, entries);
  let html=''; let idx=0;
  schema.sections.forEach(s=>{
    html += `<div class="section"><h2>${esc(s.title)}</h2>`;
    s.questions.forEach(()=>{ html += metricBlockHTML(results[idx], entries.length); idx++; });
    html += `</div>`;
  });
  return html;
}
function renderMetrics(){
  if(!currentGuide) return;
  const schema = schemas[currentGuide];
  const entries = entriesByGuide[currentGuide];
  const html = `<div class="toolbar"><div>${entries.length} fiche(s) analysée(s)</div><button class="btn" id="exportMetricsBtn" type="button">Exporter les métriques (CSV)</button></div>` + metricsSectionsHTML(schema, entries);
  document.getElementById('tab-metrics').innerHTML = html;
  const btn = document.getElementById('exportMetricsBtn');
  if(btn) btn.addEventListener('click', ()=> exportMetricsCSV(currentGuide));
}
function exportMetricsCSV(guide){
  guide = guide || currentGuide;
  const schema = schemas[guide];
  const entries = entriesByGuide[guide];
  if(entries.length===0){ showToast('Aucune donnée à exporter'); return; }
  const results = computeMetrics(schema, entries);
  const rows = [['Section','Question','Type','Option / Statistique','Valeur']];
  let idx=0;
  schema.sections.forEach(s=>{
    s.questions.forEach(()=>{
      const r = results[idx]; idx++;
      const qn = r.question;
      if(r.type==='choice'){
        groupChoiceCounts(qn, r.counts).forEach(o=>{
          const pct = entries.length ? Math.round(o.count/entries.length*100) : 0;
          rows.push([s.title, qn.label, 'Choix', o.label, o.count+' ('+pct+'%)']);
        });
      } else if(r.type==='number'){
        rows.push([s.title, qn.label, 'Nombre', 'Réponses', r.answered+'/'+entries.length]);
        rows.push([s.title, qn.label, 'Nombre', 'Moyenne', r.avg!==null?r.avg.toFixed(2):'']);
        rows.push([s.title, qn.label, 'Nombre', 'Min', r.min!==null?r.min:'']);
        rows.push([s.title, qn.label, 'Nombre', 'Max', r.max!==null?r.max:'']);
      } else {
        rows.push([s.title, qn.label, 'Texte', 'Réponses renseignées', r.answered+'/'+entries.length]);
      }
    });
  });
  const csv = '\uFEFF'+rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = 'agricredit-metriques-'+guide+'-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('Métriques exportées');
}

/* ---------------- ADMIN PANEL (protégé) ---------------- */
let adminUnlocked = false;
let adminSection = 'metrics'; // 'metrics' | 'agriculteurs' | 'institutions'
let adminMetricsFilter = 'all'; // 'all' | 'agriculteurs' | 'institutions'
const ADMIN_PASSWORD = '@gri1234';

function renderAdminTab(){
  if(!adminUnlocked){
    document.getElementById('tab-admin').innerHTML = `
      <div class="section" style="max-width:360px; margin:60px auto;">
        <h2>Accès administrateur</h2>
        <p class="card-sub" style="margin-top:6px;">Ce panneau permet de consulter le tableau de bord et de modifier les questions des deux guides.</p>
        <div class="field"><label>Mot de passe</label><input type="password" id="adminPasswordInput"></div>
        <button class="btn primary" id="adminUnlockBtn" type="button" style="width:100%;">Déverrouiller</button>
      </div>`;
    const input = document.getElementById('adminPasswordInput');
    const tryUnlock = ()=>{
      if(input.value === ADMIN_PASSWORD){
        adminUnlocked = true;
        adminSection = 'metrics';
        adminMetricsFilter = 'all';
        showToast('Accès admin déverrouillé');
        renderAdminTab();
      } else {
        showToast('Mot de passe incorrect');
      }
    };
    document.getElementById('adminUnlockBtn').addEventListener('click', tryUnlock);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
    input.focus();
    return;
  }
  renderAdminContent();
}
function renderAdminContent(){
  const html = `
    <div class="admin-shell">
      <nav class="admin-sidebar">
        <button class="admin-nav-btn ${adminSection==='metrics'?'active':''}" data-section="metrics" type="button">Métriques</button>
        <button class="admin-nav-btn ${adminSection==='agriculteurs'?'active':''}" data-section="agriculteurs" type="button">Agriculteurs</button>
        <button class="admin-nav-btn ${adminSection==='institutions'?'active':''}" data-section="institutions" type="button">Institutions</button>
        <button class="btn small" id="adminLockBtn" type="button" style="margin-top:14px;">Verrouiller</button>
      </nav>
      <div class="admin-content" id="adminContentArea"></div>
    </div>`;
  document.getElementById('tab-admin').innerHTML = html;
  document.querySelectorAll('.admin-nav-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ adminSection = btn.dataset.section; renderAdminContent(); });
  });
  document.getElementById('adminLockBtn').addEventListener('click', ()=>{
    adminUnlocked = false;
    renderAdminTab();
    showToast('Panneau verrouillé');
  });
  renderAdminSectionContent();
}
function renderAdminSectionContent(){
  const area = document.getElementById('adminContentArea');
  if(adminSection==='metrics'){
    area.innerHTML = adminMetricsHTML();
    bindAdminMetricsEvents();
    return;
  }
  const guideKey = adminSection;
  const schema = schemas[guideKey];
  area.innerHTML = `
    <h2 style="font-size:1rem; margin-bottom:4px;">${esc(schema.title)}</h2>
    <p class="card-sub" style="margin:0 0 14px;">Modifier les questions de ce guide — les changements s'appliquent pour tout le monde dès l'enregistrement.</p>
    <div id="editorContainer">${schema.sections.map(s=>editorSectionHTML(s)).join('')}</div>
    <div class="editor-footer">
      <button class="btn" id="addSectionBtn" type="button">+ Ajouter une section</button>
      <button class="btn primary" id="saveSchemaBtn" type="button">Enregistrer les modifications</button>
      <button class="btn danger" id="resetSchemaBtn" type="button">Réinitialiser aux valeurs par défaut</button>
    </div>`;
  bindEditorEvents('adminContentArea', guideKey);
}
function adminMetricsHTML(){
  let html = `<div class="admin-metrics-filter">
    <div class="chip-group" id="adminMetricsFilterGroup" data-mode="single">
      <div class="chip ${adminMetricsFilter==='all'?'selected':''}" data-value="all">Tous les entretiens</div>
      <div class="chip ${adminMetricsFilter==='agriculteurs'?'selected':''}" data-value="agriculteurs">Agriculteurs</div>
      <div class="chip ${adminMetricsFilter==='institutions'?'selected':''}" data-value="institutions">Institutions</div>
    </div>
  </div>`;
  if(adminMetricsFilter==='all'){
    const totalAll = entriesByGuide.agriculteurs.length + entriesByGuide.institutions.length;
    html += `<div class="stat-cards">
      <div class="stat-card"><div class="num">${totalAll}</div><div class="label">Fiches au total</div></div>
      <div class="stat-card"><div class="num">${entriesByGuide.agriculteurs.length}</div><div class="label">Agriculteurs</div></div>
      <div class="stat-card"><div class="num">${entriesByGuide.institutions.length}</div><div class="label">Institutions</div></div>
    </div>`;
    ['agriculteurs','institutions'].forEach(g=>{
      html += `<h2 style="font-size:.95rem; margin:18px 0 10px; color:var(--accent-text);">${esc(schemas[g].title)}</h2>`;
      html += `<div class="toolbar"><div>${entriesByGuide[g].length} fiche(s)</div><button class="btn small export-metrics-btn" data-guide="${g}" type="button">Exporter (CSV)</button></div>`;
      html += metricsSectionsHTML(schemas[g], entriesByGuide[g]);
    });
  } else {
    const g = adminMetricsFilter;
    html += `<div class="stat-cards">
      <div class="stat-card"><div class="num">${entriesByGuide[g].length}</div><div class="label">Fiches collectées</div></div>
      <div class="stat-card"><div class="num">${schemas[g].sections.length}</div><div class="label">Sections</div></div>
      <div class="stat-card"><div class="num">${flatQuestions(schemas[g]).length}</div><div class="label">Questions</div></div>
    </div>`;
    html += `<div class="toolbar"><div>Vue d'ensemble des réponses</div><button class="btn export-metrics-btn" data-guide="${g}" type="button">Exporter les métriques (CSV)</button></div>`;
    html += metricsSectionsHTML(schemas[g], entriesByGuide[g]);
  }
  return html;
}
function bindAdminMetricsEvents(){
  const group = document.getElementById('adminMetricsFilterGroup');
  group.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      adminMetricsFilter = chip.dataset.value;
      renderAdminSectionContent();
    });
  });
  document.querySelectorAll('.export-metrics-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> exportMetricsCSV(btn.dataset.guide));
  });
}
function editorSectionHTML(s){
  let qhtml = s.questions.map(qn=>editorQuestionHTML(qn)).join('');
  return `<div class="editor-section" data-section-id="${s.id}">
    <div class="sec-head">
      <input type="text" class="section-title-input" value="${esc(s.title)}">
      <button class="btn small danger del-section" type="button">Supprimer la section</button>
    </div>
    <div class="editor-questions">${qhtml}</div>
    <button class="btn small add-question" type="button">+ Ajouter une question</button>
  </div>`;
}
function editorQuestionHTML(qn){
  const isChoice = qn.type==='single'||qn.type==='multi';
  return `<div class="editor-question" data-qid="${qn.id}">
    <div class="row">
      <input type="text" class="q-label" value="${esc(qn.label)}" placeholder="Intitulé de la question">
      <select class="q-type">
        <option value="text" ${qn.type==='text'?'selected':''}>Texte court</option>
        <option value="textarea" ${qn.type==='textarea'?'selected':''}>Texte long</option>
        <option value="number" ${qn.type==='number'?'selected':''}>Nombre</option>
        <option value="date" ${qn.type==='date'?'selected':''}>Date</option>
        <option value="single" ${qn.type==='single'?'selected':''}>Choix unique</option>
        <option value="multi" ${qn.type==='multi'?'selected':''}>Choix multiple</option>
        <option value="proof" ${qn.type==='proof'?'selected':''}>Preuve (lien ou fichier)</option>
      </select>
    </div>
    <textarea class="opts ${isChoice?'show':''}" placeholder="Une option par ligne">${esc(qn.options.join('\n'))}</textarea>
    <label class="other-toggle ${isChoice?'show':''}"><input type="checkbox" class="q-other" ${qn.hasOther?'checked':''}> Ajouter une option "Autre" avec champ libre</label>
    <div class="q-actions">
      <button class="btn small q-up" type="button">Monter</button>
      <button class="btn small q-down" type="button">Descendre</button>
      <button class="btn small danger q-del" type="button">Supprimer</button>
    </div>
  </div>`;
}
function bindEditorEvents(rootId, guideKey){
  const root = document.getElementById(rootId || 'adminContentArea');
  guideKey = guideKey || adminSection;

  root.querySelectorAll('.q-type').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const qDiv = sel.closest('.editor-question');
      const isChoice = sel.value==='single'||sel.value==='multi';
      qDiv.querySelector('.opts').classList.toggle('show', isChoice);
      qDiv.querySelector('.other-toggle').classList.toggle('show', isChoice);
    });
  });
  root.querySelectorAll('.q-up').forEach(btn=> btn.addEventListener('click', ()=>{
    const qDiv = btn.closest('.editor-question');
    const prev = qDiv.previousElementSibling;
    if(prev) qDiv.parentNode.insertBefore(qDiv, prev);
  }));
  root.querySelectorAll('.q-down').forEach(btn=> btn.addEventListener('click', ()=>{
    const qDiv = btn.closest('.editor-question');
    const next = qDiv.nextElementSibling;
    if(next) qDiv.parentNode.insertBefore(next, qDiv);
  }));
  root.querySelectorAll('.q-del').forEach(btn=> btn.addEventListener('click', ()=>{
    if(confirm('Supprimer cette question ?')) btn.closest('.editor-question').remove();
  }));
  root.querySelectorAll('.add-question').forEach(btn=> btn.addEventListener('click', ()=>{
    const container = btn.previousElementSibling;
    const div = document.createElement('div');
    div.innerHTML = editorQuestionHTML({id:genId('q'), label:'', type:'text', options:[], hasOther:false});
    container.appendChild(div.firstElementChild);
    bindEditorEvents(rootId, guideKey);
  }));
  root.querySelectorAll('.del-section').forEach(btn=> btn.addEventListener('click', ()=>{
    if(confirm('Supprimer cette section et toutes ses questions ?')) btn.closest('.editor-section').remove();
  }));
  const addSectionBtn = root.querySelector('#addSectionBtn');
  if(addSectionBtn) addSectionBtn.onclick = ()=>{
    const div = document.createElement('div');
    div.innerHTML = editorSectionHTML({id:genId('sec'), title:'Nouvelle section', questions:[]});
    root.querySelector('#editorContainer').appendChild(div.firstElementChild);
    bindEditorEvents(rootId, guideKey);
  };
  const saveBtn = root.querySelector('#saveSchemaBtn');
  if(saveBtn) saveBtn.onclick = async ()=>{
    const newSchema = {title:schemas[guideKey].title, sections:[]};
    root.querySelectorAll('#editorContainer .editor-section').forEach(secDiv=>{
      const title = secDiv.querySelector('.section-title-input').value.trim() || 'Section';
      const questions = [];
      secDiv.querySelectorAll('.editor-question').forEach(qDiv=>{
        const label = qDiv.querySelector('.q-label').value.trim();
        if(!label) return;
        const type = qDiv.querySelector('.q-type').value;
        const isChoice = type==='single'||type==='multi';
        const opts = isChoice ? qDiv.querySelector('.opts').value.split('\n').map(s=>s.trim()).filter(Boolean) : [];
        const hasOther = isChoice && qDiv.querySelector('.q-other').checked;
        questions.push({id:qDiv.dataset.qid, label, type, options:opts, hasOther});
      });
      newSchema.sections.push({id:secDiv.dataset.sectionId, title, questions});
    });
    try{
      await setDoc(doc(db,'schemas',guideKey), newSchema);
      showToast('Questions mises à jour pour tout le monde');
    }catch(e){ showToast('Erreur de sauvegarde'); console.error(e); }
  };
  const resetBtn = root.querySelector('#resetSchemaBtn');
  if(resetBtn) resetBtn.onclick = async ()=>{
    if(!confirm('Réinitialiser ce guide aux questions par défaut ? Les modifications seront perdues pour tout le monde.')) return;
    try{
      await setDoc(doc(db,'schemas',guideKey), DEFAULT_SCHEMAS[guideKey]);
      showToast('Guide réinitialisé');
    }catch(e){ showToast('Erreur de réinitialisation'); }
  };
}

/* ---------------- NAVIGATION ---------------- */
function selectGuide(guide){
  currentGuide = guide;
  editingId = null; editingCreatedAt = null;
  adminUnlocked = false;
  document.getElementById('landing').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('guideTitle').textContent = schemas[guide].title;
  document.getElementById('guideSub').textContent = 'AgriCréditPlus — données partagées en temps réel entre enquêteurs';
  showTab('form');
  renderForm(); renderTable();
  updateSaveButtonLabel();
}
function showTab(tab){
  currentTab = tab;
  ['form','table','metrics','admin'].forEach(t=>{
    document.getElementById('tab-'+t).style.display = t===tab ? 'block':'none';
  });
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('formActionBar').style.display = tab==='form' ? 'flex' : 'none';
  if(tab==='metrics') renderMetrics();
  if(tab==='admin') renderAdminTab();
}

document.querySelectorAll('.guide-card').forEach(card=>{
  card.addEventListener('click', ()=> selectGuide(card.dataset.guide));
});
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> showTab(btn.dataset.tab));
});
document.getElementById('backToLanding').addEventListener('click', ()=>{
  document.getElementById('app').style.display='none';
  document.getElementById('landing').style.display='flex';
});
document.getElementById('saveBtn').addEventListener('click', async ()=>{
  try{
    if(editingId){
      await setDoc(doc(db,'entries_'+currentGuide, editingId), {
        createdAt: editingCreatedAt || new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        answers: collectAnswers()
      });
      showToast('Fiche mise à jour');
    } else {
      await addDoc(collection(db,'entries_'+currentGuide), {createdAt:new Date().toISOString(), answers:collectAnswers()});
      showToast('Fiche enregistrée');
    }
    editingId = null; editingCreatedAt = null;
    updateSaveButtonLabel();
    clearForm();
  }catch(e){ showToast('Erreur d\'enregistrement'); console.error(e); }
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  const wasEditing = !!editingId;
  clearForm();
  editingId = null; editingCreatedAt = null;
  updateSaveButtonLabel();
  showToast(wasEditing ? 'Modification annulée' : 'Nouvelle fiche prête');
});

</script>
